name: Release

# On a v* tag: build with Developer ID, notarize, staple, attach the dmg to the release, update the Homebrew cask.
# Secrets (same names as the other midagedev apps): MACOS_SIGN_P12 (base64 .p12), MACOS_SIGN_PASSWORD,
# MACOS_NOTARY_KEY (.p8, PEM or base64), MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER_ID, TAP_DEPLOY_KEY (write key
# for midagedev/homebrew-tap).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no release, no cask)"
        required: true

permissions:
  contents: write

jobs:
  macos:
    # macOS 27 with Xcode 27 (preview image): the app needs the macOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: |
          v="${{ inputs.version }}"
          [[ -n "$v" ]] || v="${GITHUB_REF_NAME#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Tools
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_SIGN_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          [[ -n "$IDENTITY" ]] || { echo "no Developer ID Application identity in the p12" >&2; exit 1; }
          echo "MWOYEO_RELEASE_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Notarization key
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$MACOS_NOTARY_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$MACOS_NOTARY_KEY" > "$KEY_PATH"
          else
            printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          {
            echo "MWOYEO_NOTARY_KEY=$KEY_PATH"
            echo "MWOYEO_NOTARY_KEY_ID=$MACOS_NOTARY_KEY_ID"
            echo "MWOYEO_NOTARY_ISSUER_ID=$MACOS_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        run: scripts/release.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: build/release/Mwoyeo-*.dmg
          if-no-files-found: error

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Mwoyeo $VERSION" --generate-notes
          gh release upload "$GITHUB_REF_NAME" build/release/Mwoyeo-"$VERSION"-arm64.dmg --clobber
          # The same image without a version, so releases/latest/download/Mwoyeo-arm64.dmg always means the newest.
          cp build/release/Mwoyeo-"$VERSION"-arm64.dmg build/release/Mwoyeo-arm64.dmg
          gh release upload "$GITHUB_REF_NAME" build/release/Mwoyeo-arm64.dmg --clobber
          # What the app's update check downloads; their download counts are the usage numbers (scripts/stats.py).
          mkdir -p build/counters
          printf '{"version":"%s","page":"https://github.com/%s/releases/tag/%s"}\n' "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > build/counters/version.json
          echo '{}' > build/counters/install.json
          echo '{}' > build/counters/month.json
          gh release upload "$GITHUB_REF_NAME" build/counters/version.json build/counters/install.json build/counters/month.json --clobber

      - name: Homebrew cask
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:midagedev/homebrew-tap.git "$RUNNER_TEMP/tap"
          sha=$(shasum -a 256 build/release/Mwoyeo-"$VERSION"-arm64.dmg | cut -d' ' -f1)
          scripts/cask.sh "$VERSION" "$sha" > "$RUNNER_TEMP/tap/Casks/mwoyeo.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "midagedev"
          git config user.email "midagedev@users.noreply.github.com"
          git add Casks/mwoyeo.rb
          git commit -m "mwoyeo $VERSION"
          git push
