name: Mwoyeo
options:
  bundleIdPrefix: dev.midagedev
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  MwoyeoCore:
    path: Core
targets:
  Mwoyeo:
    type: application
    platform: macOS
    sources:
      - path: App
      # MI-GAN (MIT), converted by tools/inpaint/convert_migan.sh; the app falls back to flat fill without it.
      - path: tools/inpaint/models/MIGAN_512.mlpackage
        optional: true
    dependencies:
      - package: MwoyeoCore
        product: MwoyeoCore
      - package: MwoyeoCore
        product: MwoyeoEngines
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mwoyeo
        CFBundleName: Mwoyeo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 midagedev"
        NSScreenCaptureUsageDescription: "Mwoyeo reads the text under your lenses so it can translate it in place."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.midagedev.mwoyeo
        PRODUCT_NAME: Mwoyeo
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(MWOYEO_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(MWOYEO_TEAM)
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Local builds skip the timestamp server; scripts/release.sh signs with --timestamp for notarization.
        OTHER_CODE_SIGN_FLAGS: --timestamp=none
        CODE_SIGN_ENTITLEMENTS: App/Mwoyeo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
        COREML_CODEGEN_LANGUAGE: None
