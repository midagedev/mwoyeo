name: Mwoyeo
options:
  bundleIdPrefix: dev.midagedev
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
# MAS is the Mac App Store flavour of the same targets: Release-like, the Swift condition `MAS`, sandbox, its own bundle id
# (Config/MAS.xcconfig; `scripts/mas.sh`, scheme Mwoyeo-MAS). Debug and Release are the DMG flavour.
configs:
  Debug: debug
  Release: release
  MAS: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
  MAS: Config/MAS.xcconfig
settings:
  base:
    # MWOYEO_APP_ID (the app's id; the reader services derive theirs from it), the signing identity and the entitlements files are
    # in Config/Base.xcconfig and Config/MAS.xcconfig: a setting here would win over the xcconfig of a configuration.
    # One version for the app and its services.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  MwoyeoCore:
    path: Core
targetTemplates:
  # The two XPC services that run Vision outside the app (docs/design/recognition.md §4.2): one source directory, the role comes
  # from each service's Info.plist. Hardened runtime on both; Developer ID builds carry no entitlements, a Mac App Store build
  # signs them with Reader/Reader-MAS.entitlements (CODE_SIGN_ENTITLEMENTS=Reader/Reader-MAS.entitlements).
  # Reader/PrivacyInfo.xcprivacy is the services' privacy manifest (a file of the `Reader` source path, so it lands in each
  # service's Contents/Resources); the app's is App/Resources/PrivacyInfo.xcprivacy, of the `App` path.
  ReaderService:
    type: xpc-service
    platform: macOS
    sources:
      - path: Reader
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Shared
    dependencies:
      - package: MwoyeoCore
        product: MwoyeoCore
    info:
      path: Reader/${role}.plist
      properties:
        CFBundleDisplayName: Mwoyeo Reader (${role})
        CFBundleName: MwoyeoReader-${role}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        MwoyeoReaderRole: ${role}
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MWOYEO_APP_ID).reader.${role}
        PRODUCT_NAME: MwoyeoReader-${role}
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(MWOYEO_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(MWOYEO_TEAM)
        PROVISIONING_PROFILE_SPECIFIER: ""
        OTHER_CODE_SIGN_FLAGS: --timestamp=none
        CODE_SIGN_ENTITLEMENTS: $(MWOYEO_READER_ENTITLEMENTS)
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
        # The document read (`RecognizeDocumentsRequest`) is compiled into the services only: the app cannot run one (`VisionExec`).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) READER_SERVICE"
targets:
  # The service that runs the regex rows and the scripts of the rewrite rules (docs/design/rewrite-rules.md §5), in JavaScriptCore with nothing but the
  # language: no network, no files. Same shape as the reader services; hardened runtime, no entitlements in a Developer ID build, only the App Sandbox in
  # the Mac App Store one (Script/Script-MAS.entitlements). Script/PrivacyInfo.xcprivacy is its privacy manifest.
  MwoyeoScript:
    type: xpc-service
    platform: macOS
    sources:
      - path: Script
        excludes:
          - "*.plist"
          - "*.entitlements"
    dependencies:
      - package: MwoyeoCore
        product: MwoyeoCore
    info:
      path: Script/Info.plist
      properties:
        CFBundleDisplayName: Mwoyeo Script
        CFBundleName: MwoyeoScript
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MWOYEO_APP_ID).script
        PRODUCT_NAME: MwoyeoScript
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(MWOYEO_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(MWOYEO_TEAM)
        PROVISIONING_PROFILE_SPECIFIER: ""
        OTHER_CODE_SIGN_FLAGS: --timestamp=none
        CODE_SIGN_ENTITLEMENTS: $(MWOYEO_SCRIPT_ENTITLEMENTS)
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
  MwoyeoReaderLines:
    templates: [ReaderService]
    templateAttributes:
      role: lines
  MwoyeoReaderDocs:
    templates: [ReaderService]
    templateAttributes:
      role: docs
  Mwoyeo:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - AppIcon.icon
      # The Icon Composer icon (tools/app-icon/make-icon.swift): one file reference, so actool compiles it as AppIcon.
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Shared
      # MI-GAN (MIT), converted by tools/inpaint/convert_migan.sh; the app falls back to flat fill without it.
      - path: tools/inpaint/models/MIGAN_512.mlpackage
        optional: true
    dependencies:
      - package: MwoyeoCore
        product: MwoyeoCore
      - package: MwoyeoCore
        product: MwoyeoEngines
      # Embedded in Mwoyeo.app/Contents/XPCServices, signed with the app.
      - target: MwoyeoReaderLines
        embed: true
      - target: MwoyeoReaderDocs
        embed: true
      - target: MwoyeoScript
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mwoyeo
        CFBundleName: Mwoyeo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 midagedev"
        # Ollama, LM Studio, LibreTranslate and DeepLX answer on http://localhost, which ATS blocks by default.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSScreenCaptureUsageDescription: "Mwoyeo reads the text under your lenses so it can translate it in place."
        # Only HTTPS to a host the person typed in; no encryption of our own.
        ITSAppUsesNonExemptEncryption: false
        # An engine the person added may be a server on their network (Ollama, LM Studio on another Mac).
        NSLocalNetworkUsageDescription: "Mwoyeo connects to a translation server on your network only if you add one as an engine."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MWOYEO_APP_ID)
        PRODUCT_NAME: Mwoyeo
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(MWOYEO_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(MWOYEO_TEAM)
        PROVISIONING_PROFILE_SPECIFIER: $(MWOYEO_PROFILE)
        # Local builds skip the timestamp server; scripts/release.sh signs with --timestamp for notarization.
        OTHER_CODE_SIGN_FLAGS: --timestamp=none
        CODE_SIGN_ENTITLEMENTS: $(MWOYEO_APP_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
        COREML_CODEGEN_LANGUAGE: None
# Defining any scheme turns off the generated ones, so the app's own is written out.
schemes:
  Mwoyeo:
    build:
      targets:
        Mwoyeo: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Mwoyeo-MAS:
    build:
      targets:
        Mwoyeo: all
    run:
      config: MAS
    profile:
      config: MAS
    analyze:
      config: MAS
    archive:
      config: MAS
