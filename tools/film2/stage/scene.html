<!doctype html>

<head>
<meta charset="utf-8">
<title>Stage: the moon shrine</title>
<meta name="viewport" content="width=960">
<!--
  The film2 stage: one line of tools/translation-bench/sequences/film-ja-ko-1.json as an RPG dialogue box on a night scene of our own.
  `scene.html?line=<id>` shows that line (its speaker on the name plate, its text in the box); the look is the same on every line.
  Self-contained: CSS and inline SVG only, no network, no image or font file (the Japanese is the system Hiragino).
  LINES below is a copy of the sequence's id/speaker/text; `shoot.sh` fails when the copy differs from the sequence.
  Look contract (CSS px; the page is 960x960 and is shot at device scale 2.25 = 2160 px):
    scene: top 62 % (y 0..595), no text in it. Box: inset 36 left/right/bottom, radius 18, 1 px border, height 168 (two lines of
    36 px x 1.5 = 108 plus 30 padding top and bottom), dialogue 36 px (81 px rendered), plate on the box's top-left edge, 32 px,
    its text in the dialogue's ink (the gold is its border only).
-->
<style>
  :root {
    --panel: rgba(8, 12, 26, 0.90);
    --edge: rgba(226, 234, 255, 0.60);
    --ink: #f7f4ec;
    --gold: #f1cf8e;
    --plate-ink: var(--ink);   /* the plate's text colour: the SAME as the dialogue's, so the app reads the plate as a line to translate; a
                                  different colour makes it a name tag that the app keeps as written (Core/Sources/MwoyeoCore/Runs.swift LabelRule.isNameTag) */
  }
  html, body { margin: 0; width: 960px; height: 960px; overflow: hidden; background: #05070f; }
  body { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Hiragino Maru Gothic ProN", sans-serif; }
  svg#scene { position: absolute; left: 0; top: 0; width: 960px; height: 960px; display: block; }
  #box {
    position: absolute; left: 36px; right: 36px; bottom: 36px; height: 168px; box-sizing: border-box;
    padding: 30px 36px; background: var(--panel); border: 1px solid var(--edge); border-radius: 18px;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.55);
    color: var(--ink); font-size: 36px; line-height: 1.5; font-weight: 400; letter-spacing: 0;
  }
  #text { margin: 0; height: 108px; overflow: hidden; line-break: strict; }
  #plate {
    position: absolute; left: 30px; bottom: 100%; margin-bottom: 0; box-sizing: border-box; height: 52px; padding: 0 26px;
    display: flex; align-items: center; background: var(--panel); border: 1px solid var(--gold); border-bottom: 0;
    border-radius: 14px 14px 0 0; color: var(--plate-ink); font-size: 32px; line-height: 1; font-weight: 600; white-space: nowrap;
  }
  #plate:empty { visibility: hidden; }
</style>
</head>

<script type="application/json" id="lines">[{"id":1,"speaker":null,"text":"夕暮れの山道を抜けると、苔むした石段が現れた。"},{"id":2,"speaker":"シュザンヌ","text":"九十九、ここが月影の祠よ。間違いないわ"},{"id":3,"speaker":"九十九","text":"はい、シュザンヌ様。足元にお気をつけください"},{"id":4,"speaker":"エルヴェ","text":"シュザンヌ様、お急ぎになりませぬよう。年寄りの足には堪えますので"},{"id":5,"speaker":"シュザンヌ","text":"エルヴェ、大丈夫よ。ゆっくり行きましょう"},{"id":6,"speaker":"九十九","text":"エルヴェさん、肩をお貸ししますよ"},{"id":7,"speaker":"エルヴェ","text":"九十九、お前こそ剣を落とすなよ"},{"id":8,"speaker":null,"text":"石段の先に、錆びた門が月明かりに浮かんでいた。"},{"id":9,"speaker":"シュザンヌ","text":"見て、九十九。門の奥で何かが光ってる"},{"id":10,"speaker":"ハク","text":"待っておったぞ、旅の者たち。我はこの月影の祠の番人、ハクじゃ"},{"id":11,"speaker":"エルヴェ","text":"シュザンヌ様、あれが祠の番人ですか。獣の姿をしておりますな"},{"id":12,"speaker":"シュザンヌ","text":"ハクと言ったわね。九十九、剣から手を離しなさい"},{"id":13,"speaker":"九十九","text":"はい、ですがシュザンヌ様、ハクという者から月涙石の気配がします"},{"id":14,"speaker":"ハク","text":"月涙石を持つ者だけが、夜明けの守り手に会える。それが祠の掟じゃ"},{"id":15,"speaker":"エルヴェ","text":"夜明けの守り手の話は、古い書物で読んだ覚えがございます"},{"id":16,"speaker":"シュザンヌ","text":"それなら話が早いわ。エルヴェ、続きを聞かせて"},{"id":17,"speaker":"エルヴェ","text":"はい。夜明けの守り手は、月涙石に宿る光で眠りから覚めると申します"},{"id":18,"speaker":null,"text":"ハクの尻尾が、青白く揺れた。"},{"id":19,"speaker":"ハク","text":"月涙石は月影の祠の奥、水鏡の底に沈んでおる。取ってこられるかな"},{"id":20,"speaker":"九十九","text":"エルヴェさん、水鏡って冷たいんですか"},{"id":21,"speaker":"エルヴェ","text":"冷たいだけならよいがな。底は、触れた者の迷いを映すのじゃ"},{"id":22,"speaker":"シュザンヌ","text":"九十九、私が行くわ。この月影の祠は私の家の先祖が建てたのよ"},{"id":23,"speaker":"九十九","text":"シュザンヌ様、いけません。水鏡には私が参ります"},{"id":24,"speaker":"シュザンヌ","text":"頑固ね。じゃあ、二人で行きましょう"},{"id":25,"speaker":"エルヴェ","text":"お供できず申し訳ございません。ここで月影の祠をお守りいたします"},{"id":26,"speaker":null,"text":"二人は水鏡の縁に立った。月の光が、静かに揺れてい"},{"id":27,"speaker":"九十九","text":"シュザンヌ様、私の手をお取りください"},{"id":28,"speaker":"シュザンヌ","text":"ありがとう、九十九。行くわよ"},{"id":29,"speaker":null,"text":"水の底で、月涙石が青く脈打っていた。"},{"id":30,"speaker":"九十九","text":"シュザンヌ様、ありました。これが月涙石です"},{"id":31,"speaker":"シュザンヌ","text":"持ち上げて、九十九。ゆっくりよ"},{"id":32,"speaker":null,"text":"石が光を放ち、月影の祠全体が低く震え出した。"},{"id":33,"speaker":"ハク","text":"よくやった。目覚めの時じゃ、夜明けの守り手よ"},{"id":34,"speaker":"エルヴェ","text":"九十九、よく無事でいたな。シュザンヌ様を頼んだぞ"},{"id":35,"speaker":"九十九","text":"はい、エルヴェさんのおかげです"},{"id":36,"speaker":null,"text":"夜明けの守り手が、ゆっくりと目を開いた。"}]</script>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  // Deterministic stars and pines (a seeded generator): the scene is the same in every shot.
  var seed = 20261020;
  function rnd() { seed = (seed + 0x6D2B79F5) | 0; var t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  function add(parent, tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
  var stars = document.getElementById("stars");
  for (var i = 0; i < 70; i++) {
    var x = rnd() * 960, y = rnd() * rnd() * 330 + 10;
    if (Math.hypot(x - 742, y - 148) < 90) continue;
    add(stars, "circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: (0.6 + rnd() * 1.5).toFixed(2), opacity: (0.35 + rnd() * 0.65).toFixed(2) });
  }
  var pines = document.getElementById("pines");
  function pine(cx, base, h) {
    var w = h * 0.34;
    for (var k = 0; k < 4; k++) {
      var top = base - h + k * h * 0.2, half = w * (0.35 + k * 0.22), bot = top + h * 0.34;
      add(pines, "path", { d: "M" + (cx - half) + " " + bot + " L" + cx + " " + top + " L" + (cx + half) + " " + bot + "Z" });
    }
    add(pines, "rect", { x: cx - 3, y: base - h * 0.12, width: 6, height: h * 0.14 });
  }
  [[40, 470, 190], [96, 486, 150], [150, 478, 214], [214, 490, 138], [770, 482, 158], [832, 470, 216], [896, 486, 168], [940, 474, 196]]
    .forEach(function (p) { pine(p[0], p[1], p[2]); });

  var lines = JSON.parse(document.getElementById("lines").textContent);
  var params = new URLSearchParams(location.search);
  // `&plate=tag`: the plate text in the gold, a different colour from the dialogue, which the app keeps as written (a name tag).
  if (params.get("plate") === "tag") document.documentElement.style.setProperty("--plate-ink", "var(--gold)");
  var id = params.get("line");
  var line = lines.filter(function (l) { return String(l.id) === id; })[0];
  document.getElementById("plate").textContent = line && line.speaker ? line.speaker : "";
  var text = document.getElementById("text");
  text.textContent = line ? line.text : "";
  // How many 54 px lines the text needs (the box holds two); `shoot.sh` reads it from the dumped DOM.
  text.style.height = "auto";
  document.documentElement.setAttribute("data-lines", String(Math.round(text.offsetHeight / 54)));
  text.style.height = "";
})();
</script>
