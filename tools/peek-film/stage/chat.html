<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>旅行の計画</title>
<style>
*{box-sizing:border-box;margin:0}
body{font:15.5px/1.45 -apple-system,"Hiragino Sans",sans-serif;background:#f2f2f7;color:#1c1c1e;width:600px;overflow:hidden}
header{background:#fff;border-bottom:1px solid #e3e3e8;padding:12px 18px;font-weight:600;font-size:15px}
header span{display:block;font-weight:400;font-size:12px;color:#8e8e93}
.log{padding:14px 18px}
.m{display:flex;gap:9px;margin-bottom:12px;align-items:flex-start}
.av{width:30px;height:30px;border-radius:50%;flex:none;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.n{font-size:12px;color:#8e8e93;margin-bottom:3px}
.b{background:#fff;border-radius:16px;padding:8px 13px;max-width:400px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.me{flex-direction:row-reverse}
.me .b{background:#0a84ff;color:#fff}
.t{font-size:11px;color:#aeaeb2;align-self:flex-end;white-space:nowrap}
</style></head><body>
<header>旅行の計画<span>3人のメンバー</span></header>
<div class="log">
<div class="m"><div class="av" style="background:#ff9f0a">ゆ</div><div><div class="n">ゆき</div><div class="b">来週の金曜日、港町に行くのはどうかな？天気予報では晴れるみたい。</div></div><div class="t">9:41</div></div>
<div class="m"><div class="av" style="background:#30d158">け</div><div><div class="n">けん</div><div class="b">いいね！朝の電車に乗れば、昼ごはんは海の近くで食べられるよ。</div></div><div class="t">9:43</div></div>
<div class="m me"><div class="b">賛成です。駅から灯台まで歩いてみたいです。</div><div class="t">9:44</div></div>
<div class="m"><div class="av" style="background:#ff9f0a">ゆ</div><div><div class="n">ゆき</div><div class="b">じゃあ、宿は私が探しておくね。暖炉のある部屋があったら最高！</div></div><div class="t">9:46</div></div>
<div class="m"><div class="av" style="background:#30d158">け</div><div><div class="n">けん</div><div class="b">帰りは少し遅くなっても大丈夫。夕日を見てから帰ろう。</div></div><div class="t">9:47</div></div>
</div>
</body></html>
