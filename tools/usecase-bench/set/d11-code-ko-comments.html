<!doctype html><meta charset=utf-8><body style="margin:0;width:860px;height:420px;background:#fff;color:#222;font:15px/1.6 Menlo,'Apple SD Gothic Neo',monospace;padding:20px;box-sizing:border-box"><div style="color:#6a737d">// 사용자가 로그인했는지 확인한다.</div><div>func isLoggedIn() -&gt; Bool {</div><div>&nbsp;&nbsp;&nbsp;&nbsp;guard let token = store.token else { return false }</div><div style="color:#6a737d">&nbsp;&nbsp;&nbsp;&nbsp;// 토큰이 만료되었으면 로그아웃 상태로 본다.</div><div>&nbsp;&nbsp;&nbsp;&nbsp;return !token.isExpired</div><div>}</div>
