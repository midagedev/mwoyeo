<!doctype html><meta charset=utf-8><body style="margin:0;width:900px;height:560px;background:#fff;color:#232629;box-sizing:border-box;overflow:hidden"><div style="padding:22px 30px;font:15px/1.6 -apple-system,'Helvetica Neue','Apple SD Gothic Neo','Hiragino Sans','PingFang SC',sans-serif"><div style="font-size:24px;font-weight:600;color:#3b4045;margin-bottom:6px">グループごとの合計を新しい列に入れるには</div><div style="font-size:13px;color:#6a737d;border-bottom:1px solid #e3e6e8;padding-bottom:10px;margin-bottom:14px">質問日 2026年3月4日　　閲覧 1.2万回</div><div style="font-size:19px;font-weight:600;margin:6px 0 8px">回答</div><p style="margin:6px 0"><code style="font:13.5px Menlo,'Apple SD Gothic Neo','Hiragino Sans','PingFang SC',monospace;background:#eff1f3;border-radius:4px;padding:1px 5px;color:#24292f">groupby</code> と <code style="font:13.5px Menlo,'Apple SD Gothic Neo','Hiragino Sans','PingFang SC',monospace;background:#eff1f3;border-radius:4px;padding:1px 5px;color:#24292f">transform</code> を組み合わせると、元の行を減らさずに合計を付けられます。</p><div style="font:14px Menlo,'Apple SD Gothic Neo','Hiragino Sans','PingFang SC',monospace;background:#f6f8fa;color:#24292f;border-radius:8px;padding:12px 16px;margin:10px 0;"><div style="white-space:pre;height:21.7px">df[&quot;total&quot;] = df.groupby(&quot;shop&quot;)[&quot;price&quot;].transform(&quot;sum&quot;)</div><div style="white-space:pre;height:21.7px">print(df[&quot;total&quot;].tolist())</div></div><p style="margin:6px 0">実行すると、次のように店ごとの合計が各行に入ります。</p><div style="font:14px Menlo,'Apple SD Gothic Neo','Hiragino Sans','PingFang SC',monospace;background:#2d2d2d;color:#e6e6e6;border-radius:8px;padding:12px 16px;margin:10px 0;"><div style="white-space:pre;height:21.7px">[30, 30, 70, 70]</div></div><p style="margin:6px 0"><code style="font:13.5px Menlo,'Apple SD Gothic Neo','Hiragino Sans','PingFang SC',monospace;background:#eff1f3;border-radius:4px;padding:1px 5px;color:#24292f">agg</code> を使うと行数が変わるので、この場合は向いていません。</p><div style="margin-top:14px;font-size:13px;color:#6a737d">この回答を共有する　フォローする　編集する</div></div>
