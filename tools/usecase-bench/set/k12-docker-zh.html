<!doctype html><meta charset=utf-8><body style="margin:0;width:860px;height:640px;background:#fff;color:#24292f;box-sizing:border-box;overflow:hidden"><div style="padding:26px 34px;font:15px/1.7 -apple-system,'Helvetica Neue','Apple SD Gothic Neo','Hiragino Sans','PingFang SC',sans-serif"><div style="font-size:28px;font-weight:700;border-bottom:1px solid #d8dee4;padding-bottom:8px;margin-bottom:14px">用 Docker 运行本地服务</div><p style="margin:7px 0;">先确认已安装 Docker 24 以上版本，然后在项目目录运行下面的命令。</p><div style="font:14px Menlo,'Apple SD Gothic Neo','Hiragino Sans','PingFang SC',monospace;background:#f6f8fa;color:#24292f;border-radius:8px;padding:12px 16px;margin:10px 0;"><div style="white-space:pre;height:21.7px">$ docker compose up -d</div></div><p style="margin:7px 0;">服务启动后，用浏览器打开 <code style="font:13.5px Menlo,'Apple SD Gothic Neo','Hiragino Sans','PingFang SC',monospace;background:#eff1f3;border-radius:4px;padding:1px 5px;color:#24292f">http://localhost:8080</code> 查看页面，端口可以用 <code style="font:13.5px Menlo,'Apple SD Gothic Neo','Hiragino Sans','PingFang SC',monospace;background:#eff1f3;border-radius:4px;padding:1px 5px;color:#24292f">--port</code> 参数修改。</p><div style="font:14px Menlo,'Apple SD Gothic Neo','Hiragino Sans','PingFang SC',monospace;background:#f6f8fa;color:#24292f;border-radius:8px;padding:12px 16px;margin:10px 0;"><div style="white-space:pre;height:21.7px">services:</div><div style="white-space:pre;height:21.7px">  web:</div><div style="white-space:pre;height:21.7px">    image: shop/web:1.4</div><div style="white-space:pre;height:21.7px">    ports: [&quot;8080:80&quot;]</div></div><p style="margin:7px 0;">如果出现 <code style="font:13.5px Menlo,'Apple SD Gothic Neo','Hiragino Sans','PingFang SC',monospace;background:#eff1f3;border-radius:4px;padding:1px 5px;color:#24292f">permission denied</code>，请在命令前加上 <code style="font:13.5px Menlo,'Apple SD Gothic Neo','Hiragino Sans','PingFang SC',monospace;background:#eff1f3;border-radius:4px;padding:1px 5px;color:#24292f">sudo</code>。</p><div style="margin-top:14px;font-size:13px;color:#6a737d">分享这篇文章　　编辑</div></div>
