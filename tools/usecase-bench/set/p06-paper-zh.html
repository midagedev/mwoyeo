.ref{font-size:11.5px;padding-left:22px;text-indent:-22px;margin-bottom:5px}</style><style>body{font-family:"Songti SC",serif}</style><div class=pg><h1>基于设备端文字识别的屏幕翻译研究</h1><div class=au>李明、王芳</div><div class=au>北方大学 计算机科学系</div>
<div class=ab><b>摘要</b> 本文提出一种无需将屏幕内容上传到服务器的翻译方法。通过将识别出的文字行合并为段落，显著提高了翻译质量。</div>
<div class=cols><h2>1 引言</h2><p>阅读外语屏幕内容时，用户通常需要复制文字并粘贴到翻译工具中，这会打断阅读的连贯性。</p>
<p>为此，本文设计了一种覆盖在屏幕上方的透镜，直接在原位置替换文字。主要难点在于判断哪些行属于同一个句子。</p>
<h2>2 方法</h2><p>设识别器返回一组文字行，我们根据相邻两行的垂直间距决定是否合并。</p>
<div class=eq>g = min<sub>i</sub> d(l<sub>i</sub>, l<sub>i+1</sub>)&nbsp;&nbsp;&nbsp;(1)</div><p>间距较小的行被视为同一段落。</p></div></div>
